name: Auto Release

# Fires automatically on every merge to `staging` or `prod`.
# Can also be triggered manually (Actions → Run workflow) to release to any
# environment directly — useful for small projects without a staging branch.
#
# Computes a CalVer tag: YYYY.WW.XX.YY-stg or YYYY.WW.XX.YY-prod
#
# YYYY = year, WW = ISO week number (01–53)
# XX   = major increment within the week (resets to 1 each week)
# YY   = minor increment within XX (bugfixes, small changes)
#
# XX increments when any merged commit contains "feat!" or "BREAKING CHANGE".
# YY increments for all other merges.
#
# Example progression in week 24 of 2026:
#   2026.24.1.0-stg  ← first merge of the week to staging
#   2026.24.1.1-stg  ← bugfix
#   2026.24.2.0-stg  ← breaking change / major feature
#   2026.24.1.0-prod ← promoted to prod (or released directly via workflow_dispatch)

on:
  push:
    branches:
      - staging
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to read existing tags

      - name: Compute next version
        id: ver
        run: |
          set -e

          YEAR=$(date +%Y)
          WEEK=$(date +%V)   # ISO week, zero-padded: 01-53

          # Determine environment suffix:
          #   - workflow_dispatch: use the input value
          #   - push to prod branch: -prod
          #   - push to staging branch (or anything else): -stg
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.environment }}"
            [ "$INPUT" = "production" ] && ENV="-prod" || ENV="-stg"
          else
            BRANCH="${GITHUB_REF_NAME}"
            ENV="-stg"
            [ "$BRANCH" = "prod" ] && ENV="-prod"
          fi

          PREFIX="${YEAR}.${WEEK}."

          # Latest tag for this env this week (e.g. 2026.24.1.2-stg)
          LATEST=$(git tag -l "${PREFIX}*${ENV}" 2>/dev/null | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            # First release this week for this env
            XX=1
            YY=0
          else
            # Parse XX and YY from YYYY.WW.XX.YY-env
            INNER=${LATEST#"${PREFIX}"}
            INNER=${INNER%"${ENV}"}
            XX=$(echo "$INNER" | cut -d. -f1)
            YY=$(echo "$INNER" | cut -d. -f2)

            # Check for breaking changes since last tag
            if git log "${LATEST}..HEAD" --format="%s%n%b" 2>/dev/null \
               | grep -qE '(^feat!|BREAKING CHANGE)'; then
              XX=$((XX + 1))
              YY=0
            else
              YY=$((YY + 1))
            fi
          fi

          VERSION="${YEAR}.${WEEK}.${XX}.${YY}${ENV}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION}"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

          # Extract the top CHANGELOG section (between first ## [ and second ## [ or ---)
          awk '/^## \[/{if(p)exit; p=1; next} p && /^(## \[|---)/{exit} p{print}' CHANGELOG.md \
            > /tmp/release-notes.md

          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
