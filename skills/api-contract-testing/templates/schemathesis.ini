[tool.schemathesis]
# Base URL for Schemathesis to fuzz (override in CI with env var if needed)
base_url = "http://localhost:8000"

# The OpenAPI schema URL or path
schema = "http://localhost:8000/openapi.json"

# Seconds before a test case is cut off
max_response_time = 10

# Number of examples per generated test (raise in CI: 100+)
hypothesis_max_examples = 50

[hypothesis]
# Database of previously-discovered failing examples
database = ".hypothesis/schemathesis"