name: Quality Gates

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- Backend: lint + typecheck + coverage + format ---
      - name: Install backend deps
        run: |
          cd backend
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
          pip install pytest pytest-cov ruff mypy

      - name: Backend lint (ruff)
        run: cd backend && ruff check .

      - name: Backend format check (ruff format --check)
        run: cd backend && ruff format --check .

      - name: Backend typecheck (mypy)
        run: cd backend && mypy src/ --ignore-missing-imports

      - name: Backend tests + coverage gate
        run: |
          cd backend
          # pytest picks up addopts (including --cov-fail-under) from pyproject.toml
          # if configured; otherwise run plain pytest.
          if grep -q "cov-fail-under" pyproject.toml 2>/dev/null; then
            pytest -q
          else
            pytest -q
          fi

      # --- Frontend: lint + format + typecheck + coverage ---
      - name: Install frontend deps
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: cd frontend && npm ci

      - name: Frontend lint
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: cd frontend && npm run lint

      - name: Frontend format check
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: cd frontend && npx prettier --check .

      - name: Frontend typecheck (tsc strict)
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: cd frontend && npx tsc --noEmit

      - name: Frontend tests + coverage gate
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        run: cd frontend && npm test -- --coverage

