name: Reusable SemVer Release

# Reusable SemVer Release - centralized release workflow for Tapway product
# repos. Single source of truth for the SemVer scheme:
#   vMAJOR.MINOR.PATCH-stg   (staging)
#   vMAJOR.MINOR.PATCH-prod  (production)
#
# Consumer repos call this from their own .github/workflows/release.yml:
#
#   name: Auto Release
#   on:
#     push:
#       branches: [staging, prod]
#     workflow_dispatch:
#       inputs:
#         environment:
#           required: true
#           default: staging
#           type: choice
#           options: [staging, production]
#   jobs:
#     release:
#       permissions:
#         contents: write
#         pull-requests: read   # lets the notes quote PR descriptions
#       uses: tapway/tapway-superpowers/.github/workflows/reusable-release.yml@vX.Y.Z
#       with:
#         environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'prod' && 'production' || 'staging') }}
#       secrets: inherit
#
# Behaviour (identical to the classic per-repo copy):
#   - Bump derived from conventional commits since the last tag for the same env:
#       feat! / BREAKING CHANGE  ->  MAJOR
#       feat:                    ->  MINOR
#       anything else            ->  PATCH
#   - Each environment keeps its own independent version stream.
#   - Release notes describe every PR merged since the previous tag of the
#     same env (scripts/release_notes.py), so a -prod release covers all the
#     staging work since the last -prod. Promote with a merge commit: a squash
#     leaves only the promotion PR.
#   - Optionally syncs .claude-plugin manifests (plugin repos only), or takes
#     release notes from the top CHANGELOG.md section instead.

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or production)"
        required: true
        default: "staging"
        type: string
      sync_plugin_manifests:
        description: "Bump .claude-plugin/plugin.json & marketplace.json (Claude Code plugin repos only)"
        required: false
        default: false
        type: boolean
      release_notes_from_changelog:
        description: "Use top CHANGELOG.md section as release notes instead of PR descriptions"
        required: false
        default: false
        type: boolean

# No permissions block on purpose: the job inherits what the caller grants.
# Declaring pull-requests here would fail every caller that grants only
# contents, and declaring only contents would drop a caller's pull-requests.

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # IMPORTANT: inside a called workflow, actions/checkout defaults to the
      # workflow's OWN repo (tapway-superpowers). We must explicitly check out
      # the CALLER repository so tags/logs/releases act on the caller's code.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}

      - name: Fetch the release notes script
        uses: actions/checkout@v4
        with:
          repository: tapway/tapway-superpowers
          ref: master
          path: .tapway-release
          sparse-checkout: scripts

      - name: Compute next version
        id: ver
        run: |
          set -e

          # Environment suffix from the caller's input.
          INPUT="${{ inputs.environment }}"
          [ "$INPUT" = "production" ] && ENV="-prod" || ENV="-stg"

          # Latest semver tag for this env, e.g. v1.2.3-stg
          LATEST=$(git tag -l "v*${ENV}" 2>/dev/null | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            MAJOR=0; MINOR=0; PATCH=0
          else
            VER=${LATEST#v}
            VER=${VER%%"${ENV}"}
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
          fi

          RANGE="${LATEST:-$(git rev-list --max-parents=0 HEAD)}..HEAD"

          BUMP="patch"
          if git log "${RANGE}" --format="%s%n%b" 2>/dev/null \
             | grep -qE '(^feat!|BREAKING CHANGE)'; then
            BUMP="major"
          elif git log "${RANGE}" --format="%s" 2>/dev/null \
             | grep -qE '^(feat|feat\()'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="v${MAJOR}.${MINOR}.${PATCH}${ENV}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}"        >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (${BUMP} bump)"

      - name: Sync plugin manifest versions
        if: inputs.sync_plugin_manifests && hashFiles('.claude-plugin/plugin.json') != ''
        run: |
          set -e

          VERSION="${{ steps.ver.outputs.version }}"
          PLAIN_VERSION="${VERSION#v}"
          PLAIN_VERSION="${PLAIN_VERSION%-*}"

          jq --arg v "$PLAIN_VERSION" \
            '.metadata.version = $v | .plugins[0].version = $v' \
            .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json

          jq --arg v "$PLAIN_VERSION" '.version = $v' \
            .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .claude-plugin/; then
            echo "Manifests already at ${PLAIN_VERSION}"
          else
            git add .claude-plugin/marketplace.json .claude-plugin/plugin.json
            git commit -m "chore: sync plugin manifest version to ${PLAIN_VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Previous tag of the SAME env, read before the new tag exists; the
          # first suffixed release falls back to the last unsuffixed tag.
          SUFFIX="-stg"
          [[ "$VERSION" == *-prod ]] && SUFFIX="-prod"
          PREVIOUS="$(git tag -l 'v*' | { grep -E "^v[0-9]+\.[0-9]+\.[0-9]+${SUFFIX}$" || true; } | sort -V | tail -1)"
          if [ -z "$PREVIOUS" ]; then
            PREVIOUS="$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          fi

          git tag "$VERSION"
          git push origin "$VERSION"

          NOTES_OK=false
          if [ "${{ inputs.release_notes_from_changelog }}" = "true" ] && [ -f CHANGELOG.md ]; then
            if awk '/^## \[/{if(p)exit; p=1; next} p && /^(## \[|---)/{exit} p{print}' CHANGELOG.md \
               > /tmp/release-notes.md 2>/dev/null && [ -s /tmp/release-notes.md ]; then
              NOTES_OK=true
            fi
          fi

          if [ "$NOTES_OK" != "true" ] && python3 .tapway-release/scripts/release_notes.py \
               --tag "$VERSION" ${PREVIOUS:+--previous "$PREVIOUS"} > /tmp/release-notes.md; then
            NOTES_OK=true
          fi

          if [ "$NOTES_OK" = "true" ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "${{ github.ref_name }}" \
              --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi