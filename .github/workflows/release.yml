name: Auto Release

# Fires automatically on every merge to `staging` or `prod`.
# Can also be triggered manually (Actions → Run workflow) to release to any
# environment directly — useful for small projects without a staging branch.
#
# Produces a Semantic Versioning tag with an environment suffix:
#   vMAJOR.MINOR.PATCH-stg   (staging)
#   vMAJOR.MINOR.PATCH-prod  (production)
#
# The bump is derived from conventional commits since the last tag for the
# same environment, using standard SemVer rules:
#   feat! / BREAKING CHANGE  →  MAJOR
#   feat:                    →  MINOR
#   anything else            →  PATCH
#
# Each environment keeps its own independent version stream.
#
# Before tagging, the plain MAJOR.MINOR.PATCH (no env suffix) is also written
# into .claude-plugin/marketplace.json and .claude-plugin/plugin.json, since
# `claude plugin update` resolves versions from those manifests, not git tags.

on:
  push:
    branches:
      - staging
      - prod
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to read existing tags & commits

      - name: Compute next version
        id: ver
        run: |
          set -e

          # Determine environment suffix:
          #   - workflow_dispatch: use the input value
          #   - push to prod branch: -prod
          #   - push to staging branch (or anything else): -stg
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.environment }}"
            [ "$INPUT" = "production" ] && ENV="-prod" || ENV="-stg"
          else
            BRANCH="${GITHUB_REF_NAME}"
            ENV="-stg"
            [ "$BRANCH" = "prod" ] && ENV="-prod"
          fi

          # Latest semver tag for this env, e.g. v1.2.3-stg
          LATEST=$(git tag -l "v*${ENV}" 2>/dev/null | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            # No release for this env yet — start at 0.0.0 so the first
            # conventional commit below rolls us to 1.0.0 (feat) / 0.1.0.
            MAJOR=0; MINOR=0; PATCH=0
          else
            # Parse MAJOR.MINOR.PATCH from "vX.Y.Z-env"
            VER=${LATEST#v}
            VER=${VER%%"${ENV}"}
            MAJOR=$(echo "$VER" | cut -d. -f1)
            MINOR=$(echo "$VER" | cut -d. -f2)
            PATCH=$(echo "$VER" | cut -d. -f3)
          fi

          # Decide the bump from conventional commits since the last env tag
          # (or the repo start if this is the first release for this env).
          RANGE="${LATEST:-$(git rev-list --max-parents=0 HEAD)}..HEAD"

          BUMP="patch"
          if git log "${RANGE}" --format="%s%n%b" 2>/dev/null \
             | grep -qE '(^feat!|BREAKING CHANGE)'; then
            BUMP="major"
          elif git log "${RANGE}" --format="%s" 2>/dev/null \
             | grep -qE '^(feat|feat\()'; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="v${MAJOR}.${MINOR}.${PATCH}${ENV}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}"        >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (${BUMP} bump)"

      - name: Sync plugin manifest versions
        id: sync
        run: |
          set -e

          # Manifest "version" fields must never carry the -stg/-prod suffix —
          # Claude Code's marketplace resolver reads these as plain SemVer.
          VERSION="${{ steps.ver.outputs.version }}"
          PLAIN_VERSION="${VERSION#v}"
          PLAIN_VERSION="${PLAIN_VERSION%-*}"

          jq --arg v "$PLAIN_VERSION" \
            '.metadata.version = $v | .plugins[0].version = $v' \
            .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json

          jq --arg v "$PLAIN_VERSION" '.version = $v' \
            .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- .claude-plugin/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add .claude-plugin/marketplace.json .claude-plugin/plugin.json
            # [skip ci] prevents this push from re-triggering this workflow.
            git commit -m "chore: sync plugin manifest version to ${PLAIN_VERSION} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

          # Extract the top CHANGELOG section (between first ## [ and second ## [ or ---)
          awk '/^## \[/{if(p)exit; p=1; next} p && /^(## \[|---)/{exit} p{print}' CHANGELOG.md \
            > /tmp/release-notes.md

          gh release create "$VERSION" \
            --title "$VERSION" \
            --target "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md
