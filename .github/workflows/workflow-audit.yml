name: Workflow Audit

# Runs on every PR. Enforces the tapway-superpowers workflow discipline
# server-side so it cannot be skipped with the client hooks.
#
#   BLOCK   - secrets, non-conventional commits, no plan (scripts/workflow_audit.py)
#   WARNING - no docs/ file changed
#
# Other repos call it from their own .github/workflows/workflow-audit.yml:
#
#   name: workflow-audit
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, edited]
#   jobs:
#     audit:
#       uses: tapway/tapway-superpowers/.github/workflows/workflow-audit.yml@master

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history to compare with the base branch
      # The script lives in tapway-superpowers; caller repos do not vendor it.
      - uses: actions/checkout@v4
        if: github.repository != 'tapway/tapway-superpowers'
        with:
          repository: tapway/tapway-superpowers
          ref: master
          path: .tapway-superpowers
          sparse-checkout: scripts
          persist-credentials: false
      - name: Audit the pull request
        env:
          OWN_REPO: ${{ github.repository == 'tapway/tapway-superpowers' }}
        run: |
          if [ "$OWN_REPO" = "true" ]; then
            python3 scripts/workflow_audit.py
          else
            python3 .tapway-superpowers/scripts/workflow_audit.py
          fi
