name: workflow-gate

on:
  pull_request:
  workflow_call:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gate lives in tapway-superpowers; caller repos do not vendor it.
      - uses: actions/checkout@v4
        with:
          repository: tapway/tapway-superpowers
          ref: master
          path: .tapway-superpowers

      - name: Check plan/issue and brainstorm grounding
        run: |
          # staging<-master sync: the base is stale by definition, so the diff lists every
          # doc master gained since it forked — judging those blocks the sync that repairs
          # the base. Only the head branch `master`; feature branches are still judged.
          if [ "${{ github.head_ref }}" = "master" ]; then
            echo "staging<-master sync: docs are not re-judged"
            exit 0
          fi
          # Promotion into master (base=master) copies documents that were already
          # judged when they entered staging. Re-judging them here would block the
          # promotion for a plan nobody is authoring on this branch.
          if [ "${{ github.base_ref }}" = "master" ]; then
            echo "promotion into master: contracts were judged on staging"
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}" || true
          base="origin/${{ github.base_ref }}"
          files="$(git diff --name-only "$base"...HEAD || true)"
          if [ -z "$files" ]; then echo "no changed files"; exit 0; fi
          # shellcheck disable=SC2086
          python3 .tapway-superpowers/scripts/workflow_gate.py $files
