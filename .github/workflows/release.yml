name: Auto Release

# Fires automatically on every merge to `staging` or `master`.
# Can also be triggered manually (Actions → Run workflow) to release to any
# environment directly — useful for small projects without a staging branch.
#
# Produces a Semantic Versioning tag with an environment suffix:
#   vMAJOR.MINOR.PATCH-stg   (staging)
#   vMAJOR.MINOR.PATCH-prod  (production)
#
# The bump is derived from conventional commits since the last tag for the
# same environment, using standard SemVer rules:
#   feat! / BREAKING CHANGE  →  MAJOR
#   feat:                    →  MINOR
#   anything else            →  PATCH
#
# Each environment keeps its own independent version stream.
#
# Before tagging, the plain MAJOR.MINOR.PATCH (no env suffix) is also written
# into .claude-plugin/marketplace.json and .claude-plugin/plugin.json, since
# `claude plugin update` resolves versions from those manifests, not git tags.

on:
  push:
    branches:
      - staging
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # the manifest sync opens a PR (the branch is protected)

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed to read existing tags & commits

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail

          # Every release carries its environment: production (master/main/prod,
          # or a manual "production" dispatch) is -prod, staging is -stg. The
          # streams are independent — scripts/next_version.sh filters tags by
          # suffix, so a -stg release can never bump the production line.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.environment }}"
            if [ "$INPUT" = "production" ]; then ENV="-prod"; STREAM="prod"; else ENV="-stg"; STREAM="stg"; fi
          else
            case "${GITHUB_REF_NAME}" in
              master|main|prod) ENV="-prod"; STREAM="prod" ;;
              *)                ENV="-stg";  STREAM="stg" ;;
            esac
          fi

          VERSION="$(bash scripts/next_version.sh "$ENV")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "stream=${STREAM}" >> "$GITHUB_OUTPUT"
          echo "Computed version: ${VERSION} (scripts/next_version.sh)"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Previous tag of the SAME stream, read before the new tag exists.
          # Release notes cover what merged since it.
          case "${{ steps.ver.outputs.stream }}" in
            prod) SUFFIX="-prod" ;;
            *)    SUFFIX="-stg" ;;
          esac
          PREVIOUS="$(git tag -l 'v*' | { grep -E "^v[0-9]+\.[0-9]+\.[0-9]+${SUFFIX}$" || true; } | sort -V | tail -1)"
          # First release on a new suffix: fall back to the last plain
          # production tag so the notes still start from the previous release.
          if [ -z "$PREVIOUS" ]; then
            PREVIOUS="$(git tag -l 'v*' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)"
          fi

          # Tag + release FIRST: these must succeed regardless of the manifest
          # sync below (the ruleset may reject the bot's push to a protected
          # branch, which previously aborted the whole release).
          git tag "$VERSION"
          git push origin "$VERSION"

          # Notes describe each PR merged since PREVIOUS, using its own
          # description. They are not read from CHANGELOG.md: its top section
          # only moves when a manifest-sync PR is merged, so unmerged ones made
          # every release repeat the same text. If the script fails, GitHub's
          # title-only notes are used: the tag exists, so it must get a release.
          if python3 scripts/release_notes.py --tag "$VERSION" ${PREVIOUS:+--previous "$PREVIOUS"} > /tmp/release-notes.md; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "${{ github.ref_name }}" \
              --notes-file /tmp/release-notes.md
          else
            echo "::warning::descriptive notes failed; using GitHub's generated notes"
            gh release create "$VERSION" \
              --title "$VERSION" \
              --target "${{ github.ref_name }}" \
              --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
          fi

      - name: Sync plugin manifests (opens a PR; production stream only)
        # Only the production stream owns the plain manifests — a -stg release
        # must not publish its version to the marketplace resolver.
        if: steps.ver.outputs.stream == 'prod'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.ver.outputs.version }}"
          PLAIN="${VERSION#v}"
          PLAIN="${PLAIN%-*}"

          jq --arg v "$PLAIN" \
            '.metadata.version = $v | .plugins[0].version = $v' \
            .claude-plugin/marketplace.json > /tmp/marketplace.json
          mv /tmp/marketplace.json .claude-plugin/marketplace.json
          jq --arg v "$PLAIN" '.version = $v' \
            .claude-plugin/plugin.json > /tmp/plugin.json
          mv /tmp/plugin.json .claude-plugin/plugin.json
          # The Hermes plugin manifest is YAML; the sync step used to skip it, so
          # it stayed on 2.7.2 through four releases while the JSON files moved.
          sed -i -E "s/^version: .*/version: ${PLAIN}/" hermes/plugin/plugin.yaml
          # The changelog heading is part of the same invariant (the plugin guard
          # compares the manifests to the top CHANGELOG version).
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            # The section already describes this release: rename it in place.
            sed -i -E "0,/^## \[Unreleased\]/s//## [${PLAIN}] — $(date -u +%Y-%m-%d)/" CHANGELOG.md
          elif ! grep -q "^## \[${PLAIN}\]" CHANGELOG.md; then
            # No Unreleased section (the previous one was already renamed): open a
            # heading for this release so the changelog stays in release order.
            awk -v hdr="## [${PLAIN}] — $(date -u +%Y-%m-%d)" '
              !done && /^## \[/ { print hdr; print ""; print "_See the release notes._"; print ""; done = 1 }
              { print }
            ' CHANGELOG.md > /tmp/changelog.new
            mv /tmp/changelog.new CHANGELOG.md
          fi

          if git diff --quiet -- .claude-plugin/ hermes/plugin/plugin.yaml CHANGELOG.md; then
            echo "manifests already at ${PLAIN}"
            exit 0
          fi

          BRANCH="chore/manifest-sync-${PLAIN}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .claude-plugin/marketplace.json .claude-plugin/plugin.json \
            hermes/plugin/plugin.yaml CHANGELOG.md
          # [skip ci] in the title means merging this PR does not trigger another
          # release (the merge commit carries the marker).
          git commit -m "chore(release): sync plugin manifests to ${PLAIN} [skip ci]"
          git push origin "$BRANCH"

          if gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
               --json number --jq '.[0].number // ""' | grep -q .; then
            echo "manifest-sync PR already open for ${PLAIN}"
            exit 0
          fi
          gh pr create --repo "${{ github.repository }}" --base master --head "$BRANCH" \
            --title "chore(release): sync plugin manifests to ${PLAIN} [skip ci]" \
            --body "The Auto Release workflow tagged **${VERSION}**. \`master\` is protected, so the manifest bump lands through this PR instead of a bot push.

          \`\`\`
          plugin.yaml                 ${PLAIN}
          .claude-plugin/plugin.json  ${PLAIN}
          .claude-plugin/marketplace.json  ${PLAIN}
          \`\`\`

          Merging it does not re-trigger the release ([skip ci]). \`scripts/check-release-drift.sh\` reports RED until this lands."
