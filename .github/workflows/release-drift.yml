name: Release drift

# The Auto Release workflow writes the plugin manifests after it tags. When that
# write failed silently (bot push rejected by the protected branch) the tags ran
# ahead for three releases and nobody noticed. This runs on a schedule so the
# same silent failure shows up as a red run within a day instead of never.

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 09:17 MYT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Manifests must match the latest release tag
        run: bash scripts/check-release-drift.sh
